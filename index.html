<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex,nofollow"><title>TBF Admin</title></head>
<body style="background:#0a0a0a;color:#888;font-family:sans-serif;text-align:center;padding-top:30vh">Carregando painel...
<script>
(async function(){
  try{
    var r=await fetch('https://app.tobefit.com.br/index.html',{cache:'no-store'});
    var h=await r.text();
    h=h.replace(/<head([^>]*)>/i,'<head$1><base href="https://app.tobefit.com.br/"><meta name="robots" content="noindex,nofollow">');
    document.open();document.write(h);document.close();
    (function(){var s=document.createElement('style');s.id='admin-light';s.textContent=":root{--dark:#f3f5f8;--bg:#f3f5f8;--bg2:#f3f5f8;--card:#ffffff;--border:#d9dee5;--text:#1b1f24;--muted:#5f6b7a;--g:#2e7d32;--g2:#388e3c}html,body{background:#f3f5f8!important;color:#1b1f24!important}body *{scrollbar-color:#c5ccd6 #f3f5f8}input,textarea,select{background:#fff!important;color:#111!important;border-color:#c9d0d9!important}[style*=\"background:#111\"],[style*=\"background: #111\"],[style*=\"background:#0b0b0b\"],[style*=\"background:#181818\"],[style*=\"background:#1a1a1a\"],[style*=\"background:#0a0a0a\"]{background:#fff!important;color:#1b1f24!important;border-color:#d9dee5!important}.card,.modal,.overlay .modal{background:#fff!important;color:#1b1f24!important;border-color:#d9dee5!important}.btn-p,.btn.btn-p{color:#fff!important}img[src*=\"logo\"]{filter:invert(1) hue-rotate(180deg)}.hdr,.bottom-nav{background:#ffffff!important;border-color:#d9dee5!important;color:#1b1f24!important}.hdr .ibtn,.ibtn{background:#fff!important;color:#1b1f24!important;border-color:#d9dee5!important}.wi,.badge,.ex-load,.warmup,.gami-stat,.ex-mini,.dica-item,.al-tile,.al-search,.al-chip,.al-plan,.al-b,.al-stats div,.al-row select,.al-actions button,.adm-actions button,.ex-media{background:#eef1f5!important;border-color:#d9dee5!important;color:#3a4350!important}.al-chip.on,.al-chip.active,.al-chip.sel{background:#2e7d32!important;color:#fff!important}.al-b.ok{background:#e1f3e4!important;color:#1b5e20!important}.al-b.warn{background:#fff3d6!important;color:#8a5a00!important}.al-b.bad{background:#fde3e3!important;color:#b42318!important}.al-plan{color:#1b5e20!important}.al-name,.al-stats b,.al-tile b{color:#1b1f24!important}.al-stats span,.al-mail{color:#5f6b7a!important}body::before{content:\"PAINEL ADMIN\";display:block;text-align:center;background:#1b1f24;color:#fff;font:800 12px/1 sans-serif;letter-spacing:3px;padding:6px 0;position:sticky;top:0;z-index:99999}";document.head.appendChild(s);document.title='TBF Admin';})();
    (function(){
      var im=new Image();im.crossOrigin='anonymous';
      im.onload=function(){try{
        var c=document.createElement('canvas');c.width=c.height=192;var x=c.getContext('2d');
        x.fillStyle='#ffffff';x.fillRect(0,0,192,192);x.drawImage(im,0,0,192,192);
        var dt=x.getImageData(0,0,192,192),p=dt.data;
        for(var k=0;k<p.length;k+=4){var r=p[k],g=p[k+1],b=p[k+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b);
          if(mx-mn<45){var v=255-Math.round((r+g+b)/3);p[k]=p[k+1]=p[k+2]=v;}}
        x.putImageData(dt,0,0);
        var u=c.toDataURL('image/png');
        document.querySelectorAll('link[rel*="icon"]').forEach(function(l){l.remove();});
        ['icon','apple-touch-icon'].forEach(function(rel){var l=document.createElement('link');l.rel=rel;l.type='image/png';l.href=u;document.head.appendChild(l);});
        var tc=document.querySelector('meta[name="theme-color"]');if(tc)tc.content='#ffffff';
      }catch(e){}};
      im.src='https://app.tobefit.com.br/icon-192.png';
    })();
    var n=0,t=setInterval(function(){
      var b=document.getElementById('admin-btn');
      if(b&&b.offsetParent!==null){clearInterval(t);b.click();}
      else if(++n>240)clearInterval(t);
    },500);
  }catch(e){document.body.innerHTML='Erro ao carregar: '+e.message;}
})();
</script>
</body></html>
